[package]
name = "kw-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
bench = false

[[bin]]
name = "kerfwright"
path = "src/main.rs"

[features]
# Forwarded from kw-cam; off by default (see LICENSES/patent-watch.md).
adaptive-clearing = ["kw-cam/adaptive-clearing"]

[dependencies]
rayon.workspace = true
tokio.workspace = true
kw-feature.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
rfd.workspace = true
kw-expr.workspace = true
kw-store.workspace = true
kw-materials.workspace = true
kw-job.workspace = true
kw-drawing.workspace = true
kw-analysis.workspace = true
kw-cam.workspace = true
kw-ecad.workspace = true
kw-fem.workspace = true
kw-mesh3d.workspace = true
kw-viewer.workspace = true
kw-render.workspace = true
kw-tess.workspace = true
kw-boolean.workspace = true
kw-step.workspace = true
kw-iges.workspace = true
kw-io.workspace = true
kw-brep.workspace = true
kw-math.workspace = true
nalgebra.workspace = true
wgpu = "30"
png = "0.18"
kw-sketch.workspace = true
kw-sketcher = { path = "../kw-sketcher" }

kw-nurbs.workspace = true
kw-subd.workspace = true
kw-sheet.workspace = true
kw-dxf.workspace = true
kw-assembly.workspace = true
epaint_default_fonts = "0.36"

[dev-dependencies]
kw-fabcheck.workspace = true
kw-gsim.workspace = true
