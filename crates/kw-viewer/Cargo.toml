[package]
name = "kw-viewer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "1"
rayon.workspace = true
png = "0.18"
env_logger = "0.11"
bytemuck.workspace = true
nalgebra.workspace = true
clap = { version = "4", features = ["derive"] }
kw-math.workspace = true
kw-brep.workspace = true
kw-tess.workspace = true

[dev-dependencies]
criterion.workspace = true

[lib]
name = "kw_viewer"
path = "src/lib.rs"
bench = false

[[bin]]
name = "kw-viewer"
path = "src/main.rs"
bench = false
