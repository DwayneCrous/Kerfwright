[workspace]
resolver = "2"
members = [
    "crates/kw-math",
    "crates/kw-nurbs",
    "crates/kw-brep",
    "crates/kw-tess",
    "crates/kw-io",
    "crates/kw-viewer",
    "crates/kw-ssi",
    "crates/kw-boolean",
    "crates/kw-model",
    "crates/kw-blend",
    "crates/kw-step",
    "crates/kw-iges",
    "crates/kw-sketch",
    "crates/kw-dxf",
    "crates/kw-sketcher",
    "crates/kw-expr",
    "crates/kw-feature",
    "crates/kw-sheet",
    "crates/kw-subd",
    "crates/kw-assembly",
    "crates/kw-script",
    "crates/kw-app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
nalgebra = "0.33"
slotmap = "1"
petgraph = "0.6"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
robust = "1"
spade = "2"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rhai = { version = "1", default-features = false, features = ["std", "no_closure"] }
bytemuck = { version = "1", features = ["derive"] }
kw-math = { path = "crates/kw-math" }
kw-nurbs = { path = "crates/kw-nurbs" }
kw-brep = { path = "crates/kw-brep" }
kw-tess = { path = "crates/kw-tess" }
kw-io = { path = "crates/kw-io" }
kw-sketch = { path = "crates/kw-sketch" }
kw-dxf = { path = "crates/kw-dxf" }
kw-ssi = { path = "crates/kw-ssi" }
kw-boolean = { path = "crates/kw-boolean" }
kw-model = { path = "crates/kw-model" }
kw-blend = { path = "crates/kw-blend" }
kw-step = { path = "crates/kw-step" }
kw-iges = { path = "crates/kw-iges" }
kw-expr = { path = "crates/kw-expr" }
kw-feature = { path = "crates/kw-feature" }
kw-sheet = { path = "crates/kw-sheet" }
kw-subd = { path = "crates/kw-subd" }
kw-assembly = { path = "crates/kw-assembly" }
kw-script = { path = "crates/kw-script" }

[profile.release]
debug = 1

[profile.bench]
debug = 1
