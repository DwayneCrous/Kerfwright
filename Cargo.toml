[workspace]
resolver = "2"
members = [
    "crates/kw-math",
    "crates/kw-nurbs",
    "crates/kw-brep",
    "crates/kw-tess",
    "crates/kw-io",
    "crates/kw-viewer",
    "crates/kw-ssi",
    "crates/kw-boolean",
    "crates/kw-model",
    "crates/kw-blend",
    "crates/kw-step",
    "crates/kw-iges",
    "crates/kw-sketch",
    "crates/kw-dxf",
    "crates/kw-sketcher",
    "crates/kw-expr",
    "crates/kw-feature",
    "crates/kw-sheet",
    "crates/kw-subd",
    "crates/kw-assembly",
    "crates/kw-script",
    "crates/kw-job",
    "crates/kw-mesh3d",
    "crates/kw-fem",
    "crates/kw-gsim",
    "crates/kw-cam",
    "crates/kw-ecad",
    "crates/kw-fabcheck",
    "crates/kw-render",
    "crates/kw-materials",
    "crates/kw-store",
    "crates/kw-drawing",
    "crates/kw-analysis",
    "crates/kw-app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
nalgebra = "0.33"
slotmap = "1"
petgraph = "0.6"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
robust = "1"
spade = "2"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
ciborium = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rhai = { version = "1", default-features = false, features = ["std", "no_closure"] }
bytemuck = { version = "1", features = ["derive"] }
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
rstar = "0.12"
cavalier_contours = "0.4"
i_overlay = "4"
kw-math = { path = "crates/kw-math" }
kw-nurbs = { path = "crates/kw-nurbs" }
kw-brep = { path = "crates/kw-brep" }
kw-tess = { path = "crates/kw-tess" }
kw-io = { path = "crates/kw-io" }
kw-sketch = { path = "crates/kw-sketch" }
kw-dxf = { path = "crates/kw-dxf" }
kw-ssi = { path = "crates/kw-ssi" }
kw-boolean = { path = "crates/kw-boolean" }
kw-model = { path = "crates/kw-model" }
kw-blend = { path = "crates/kw-blend" }
kw-step = { path = "crates/kw-step" }
kw-iges = { path = "crates/kw-iges" }
kw-expr = { path = "crates/kw-expr" }
kw-feature = { path = "crates/kw-feature" }
kw-sheet = { path = "crates/kw-sheet" }
kw-subd = { path = "crates/kw-subd" }
kw-assembly = { path = "crates/kw-assembly" }
kw-script = { path = "crates/kw-script" }
kw-job = { path = "crates/kw-job" }
kw-mesh3d = { path = "crates/kw-mesh3d" }
kw-fem = { path = "crates/kw-fem" }
kw-gsim = { path = "crates/kw-gsim" }
kw-cam = { path = "crates/kw-cam" }
kw-ecad = { path = "crates/kw-ecad" }
kw-fabcheck = { path = "crates/kw-fabcheck" }
kw-render = { path = "crates/kw-render" }
kw-materials = { path = "crates/kw-materials" }
kw-store = { path = "crates/kw-store" }
kw-drawing = { path = "crates/kw-drawing" }
kw-analysis = { path = "crates/kw-analysis" }
kw-viewer = { path = "crates/kw-viewer" }

[profile.release]
debug = 1

[profile.bench]
debug = 1
